name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # macOS has a case-insensitive filesystem; the path-case tests are skipped on Linux.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.10", "3.13"]
    runs-on: ${{ matrix.os }}

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install Package
      run: python -m pip install -e .

    - name: Run Tests
      run: python -m unittest discover -s tests -t . -v
