name: Publish to PyPI

on:
  release:
    types: [published]

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    
    # Required for Trusted Publishing (OIDC)
    permissions:
      id-token: write
      contents: read
      
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"
        
    - name: Install Build Tools
      run: python -m pip install --upgrade pip build
      
    - name: Dynamically Update Version from Tag
      run: |
        # Extract version from GitHub tag (e.g., refs/tags/v1.0.0 -> 1.0.0)
        VERSION=${GITHUB_REF#refs/tags/v}
        echo "Release tag detected. Injecting version $VERSION into pyproject.toml"
        sed -i "s/^version = .*/version = \"$VERSION\"/" pyproject.toml
        
    - name: Build Package
      run: python -m build
      
    - name: Publish to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1